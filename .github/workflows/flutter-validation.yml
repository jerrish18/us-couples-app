name: Flutter validation
on:
  push:
    branches: [build/us-v1-5, feat/us-1-6, development/echo-reliability]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
      - name: Verify UI-only scope
        run: python3 scripts/check_ui_scope.py
      - name: Record toolchain
        run: flutter --version
      - name: Prepare Android platform
        run: |
          flutter create --platforms=android --org=com.jerrish18 --project-name=us --no-pub /tmp/us_platform
          cp -R /tmp/us_platform/android ./android
          python3 scripts/prepare_android.py
      - name: Resolve dependencies
        run: |
          flutter pub get
          python3 scripts/configure_plugin_compat.py
      - name: Format source
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test AI server logic
        run: node --test supabase/functions/us-ai/*.test.ts
      - name: Test auth validation
        run: flutter test
      - name: Build signed release candidate
        env:
          US_KEYSTORE_B64: ${{ secrets.US_KEYSTORE_B64 }}
          US_STORE_PASSWORD: ${{ secrets.US_STORE_PASSWORD }}
          US_KEY_PASSWORD: ${{ secrets.US_KEY_PASSWORD }}
          US_KEY_ALIAS: ${{ secrets.US_KEY_ALIAS }}
        run: |
          python3 scripts/configure_signing.py
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          python3 scripts/verify_apk.py
      - name: Preserve candidate before emulator test
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-before-install-test
          path: |
            release/Us.apk
            release/Us.apk.sha256
          retention-days: 7
      - name: Enable emulator acceleration
        run: |
          android/gradlew --stop
          sudo chmod 666 /dev/kvm
      - name: Install and launch exact signed APK on Android 7
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/emulator_smoke.py
      - name: Install and launch exact signed APK on Android 15
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: US_VERIFICATION_DIR=verification/android-15 python3 scripts/emulator_smoke.py
      - name: Remove private signing material
        if: always()
        run: rm -f android/app/us-release.jks android/key.properties
      - name: Preserve lockfile and generated platform for the release build
        uses: actions/upload-artifact@v4
        with:
          name: validated-platform
          path: |
            pubspec.lock
            android/**
            lib/**
            test/**
            !android/app/us-release.jks
            !android/key.properties
          retention-days: 1
      # Android 17 testing skipped at the user's request.
      - name: Preserve signed candidate and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-candidate
          path: |
            release/Us.apk
            release/Us.apk.sha256
            verification/**
            ui-review/**
          retention-days: 7
