name: ECHO bridge and database validation
on:
  push:
    branches: [development/echo-reliability, development/echo-on-device]
  pull_request:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r services/echo_bridge/requirements.txt
      - run: python -m unittest discover -s services/echo_bridge/tests -v
      - run: node --test supabase/functions/us-ai/*.test.ts
      - run: python scripts/test_echo_database.py
