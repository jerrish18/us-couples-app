name: Signed Android release
on:
  push:
    branches: [main]
    paths: [docs/release-ready.json]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify successful build and unchanged application source
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          report=json.loads(Path('docs/release-ready.json').read_text())
          assert report.get('ready') is True, 'Release has not passed validation'
          source=report['validated_source_commit'];run=int(report['validated_run'])
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          assert data['status']=='completed', 'Candidate build is still running'
          if data['conclusion']!='success':
              assert report.get('android_17_validation')=='skipped_at_user_request', 'Validation skip was not recorded'
              req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}/jobs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              jobs=json.load(urllib.request.urlopen(req,timeout=30))['jobs']
              assert len(jobs)==1
              steps=jobs[0]['steps']
              passed={s['name'] for s in steps if s['conclusion']=='success'}
              required={'Analyze','Test auth validation','Build signed release candidate','Install and launch exact signed APK on Android 7','Install and launch exact signed APK on Android 15'}
              assert required<=passed, 'A required release check did not pass'
              assert {s['name'] for s in steps if s['conclusion']=='failure'}=={'Install and launch exact signed APK on Android 17'}, 'A check other than the explicitly skipped Android 17 test failed'
          assert data['head_sha']==source, 'Candidate source does not match validation'
          assert data['path']=='.github/workflows/flutter-validation.yml', 'Unexpected validation workflow'
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--','lib','test','pubspec.yaml','pubspec.lock','scripts','android_templates','.github/workflows/flutter-validation.yml'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write(f'run={run}\n')
          PY
      - name: Download exact signed and emulator-tested candidate
        uses: actions/download-artifact@v4
        with:
          name: signed-candidate
          run-id: ${{ steps.validated.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify candidate checksum
        working-directory: release
        run: sha256sum --check Us.apk.sha256
      - name: Verify exact validated APK hash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          report=json.loads(Path('docs/release-ready.json').read_text())
          assert hashlib.sha256(Path('release/Us.apk').read_bytes()).hexdigest()==report['apk_sha256']
          PY
      - name: Verify signature, version and ARM architectures again
        run: |
          mkdir -p build/app/outputs/flutter-apk
          cp release/Us.apk build/app/outputs/flutter-apk/app-release.apk
          python3 scripts/verify_apk.py
          test -s verification/install-launch.txt
          test -s verification/oauth-callback-ui.xml
          ! grep -q 'FATAL EXCEPTION' verification/crashes.txt
          test -s verification/android-15/install-launch.txt
          test -s verification/android-15/oauth-callback-ui.xml
          ! grep -q 'FATAL EXCEPTION' verification/android-15/crashes.txt
      - name: Preserve release verification
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: verification/**
          retention-days: 7
      - name: Publish exact tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.6.0 release/Us.apk release/Us.apk.sha256 --target "$GITHUB_SHA" --title "Us v1.6.0" --notes-file docs/RELEASE_NOTES.md
