name: Android launch diagnosis
on:
  push:
    paths: ['scripts/android_probe.py', '.github/workflows/android-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-before-install-test
          run-id: 38606010796
          github-token: ${{ github.token }}
          path: release
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-diagnosis
          path: verification/**
          retention-days: 3
